<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a36"><title>選手名鑑 | まさはる王国</title><link rel="stylesheet" href="site.css"></head><body><header><a class="brand" href="index.html">まさはる王国</a><nav><a href="index.html">トップ</a><a href="about.html">チーム紹介</a><a href="members.html">選手名鑑</a><a href="schedule.html">試合日程</a></nav></header><main><p class="eyebrow reveal">TEAM ROSTER</p><h1 class="reveal">選手名鑑</h1><p class="muted">背番号順 ／ 選手を選ぶと詳しいプロフィールが開きます。</p><div class="grid" id="players"><p class="loading">選手情報を読み込み中…</p></div></main><footer class="foot">まさはる王国　｜　エンジョイ最優先</footer><script src="data.js"></script><script>loadPlayers().then(players=>{const el=document.getElementById('players');el.innerHTML=players.map(p=>`<a class="player" href="player.html?number=${encodeURIComponent(p.number)}"><div class="photo">${photoHtml(p.photo,p.name)}</div><div class="meta"><div class="number">${esc(p.number)}</div><div class="name">${esc(p.name)}</div><div class="catchcopy">${esc(p.catchphrase||' ')}</div></div></a>`).join('')||'<p>選手はまだ登録されていません。</p>';el.querySelectorAll('.player').forEach(a=>a.addEventListener('click',()=>sessionStorage.setItem('membersScroll',String(window.scrollY))));let y=sessionStorage.getItem('membersScroll');if(y!==null){requestAnimationFrame(()=>window.scrollTo(0,Number(y)));sessionStorage.removeItem('membersScroll');}}).catch(e=>{document.getElementById('players').innerHTML='<p class="error">選手情報を取得できませんでした。GASの公開設定と通信環境をご確認ください。</p>';console.error(e)});</script></body></html>
